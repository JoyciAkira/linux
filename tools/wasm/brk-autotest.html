<!doctype html>
<html>
<head><meta charset="utf-8"><title>arch/wasm brk-ceiling autotest</title></head>
<body>
<pre id="log"></pre>
<script type="module">
// Reproducible headless autotest for the end_brk = -1 brk-ceiling fix.
// Boots the arch/wasm kernel, then drives /bin/sh non-interactively to run
// the WASM heap/mmap probes and the blink x86-64 emulation smoke tests.
// Exposes window.__result for a headless driver (run-brk-autotest.mjs).
import { Machine, BlockDevice, ConsoleDevice } from "./dist/index.js";

const logEl = document.getElementById("log");
const out = [];
function log(s) { out.push(s); logEl.textContent += s; }

window.__consoleOutput = out;
window.__done = false;
window.__error = null;
window.__result = null;

function decodeChunk(chunk) {
  const copy = new Uint8Array(chunk.byteLength);
  copy.set(chunk);
  return new TextDecoder().decode(copy);
}

// Wait until the accumulated console output contains `marker`, or reject on timeout.
function waitFor(marker, timeoutMs) {
  return new Promise((resolve, reject) => {
    const start = Date.now();
    const tick = () => {
      if (out.join("").includes(marker)) return resolve();
      if (Date.now() - start > timeoutMs) return reject(new Error("timeout waiting for: " + marker));
      setTimeout(tick, 100);
    };
    tick();
  });
}

async function main() {
  const rootfsResp = await fetch("./rootfs.ext2");
  const rootfsBuf = new Uint8Array(await rootfsResp.arrayBuffer());
  const storage = {
    capacity: rootfsBuf.byteLength,
    read(offset, length) { return rootfsBuf.subarray(offset, offset + length); },
    write(offset, data) { rootfsBuf.set(data, offset); return data.byteLength; },
  };

  let stdinController;
  const stdin = new ReadableStream({ start(c) { stdinController = c; } });
  const stdout = new WritableStream({ write(chunk) { log(decodeChunk(chunk)); } });
  const send = (s) => stdinController.enqueue(new TextEncoder().encode(s));

  const machine = new Machine({
    cmdline: "root=/dev/vda rootfstype=ext2 rw init=/bin/sh",
    cpus: 4,
    memoryMib: 768,
    devices: [ new BlockDevice(storage), new ConsoleDevice(stdin, stdout) ],
  });

  (async () => {
    const reader = machine.bootConsole.getReader();
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      log(decodeChunk(value));
    }
  })();

  machine.on("error", (e) => {
    window.__error = String(e?.error ?? e);
    log("\n[MACHINE ERROR] " + window.__error + "\n");
  });

  log("=== booting ===\n");
  await machine.boot();
  log("\n=== boot() returned ===\n");

  // Wait for the interactive shell prompt.
  await waitFor("hush - the humble shell", 60000);

  // Run a command and wait for its REAL completion.
  //
  // The shell echoes the typed line back to the console, so a naive
  // `echo MARKER` would make the marker appear instantly (as terminal echo),
  // before the command runs. We defeat that with shell quote-concatenation:
  // the typed line contains `MARK""ER_DONE` (echoed verbatim), but the command
  // OUTPUT is the clean `MARKER_DONE` we await on. Commands thus run strictly
  // sequentially instead of interleaving.
  async function run(cmd, marker, timeoutMs = 45000) {
    const split = marker.slice(0, 3) + '""' + marker.slice(3);
    send(`${cmd}; echo ${split}\n`);
    await waitFor(marker, timeoutMs);
  }

  // 1) bigalloc: WASM binary via kernel binfmt_wasm -> exercises the brk fix.
  await run("/bin/bigalloc", "BIGALLOC_DONE");
  // 2) memprobe: wasm memory.grow probe.
  await run("/bin/memprobe", "MEMPROBE_DONE");
  // 3) blinkmmap: mmap the 99MB node binary.
  await run("/bin/blinkmmap", "BLINKMMAP_DONE");
  // 4) blink static + dynamic x86-64 ELF smoke.
  await run("/bin/blink /x86hello", "X86HELLO_DONE");
  await run("/bin/blink /x86dyn", "X86DYN_DONE");

  const text = out.join("");

  // Parse bigalloc: every posix_memalign line must report "= 0" (success).
  const bigallocLines = text.split("\n").filter((l) => l.startsWith("posix_memalign("));
  const bigallocAllOk = bigallocLines.length >= 4 && bigallocLines.every((l) => l.includes("= 0"));
  // Largest successful allocation size in MB (from "posix_memalign(NNN MB) = 0").
  let maxAllocMb = 0;
  for (const l of bigallocLines) {
    const m = l.match(/posix_memalign\((\d+)\s*MB\)\s*=\s*0/);
    if (m) maxAllocMb = Math.max(maxAllocMb, parseInt(m[1], 10));
  }

  const result = {
    booted: text.includes("=== boot() returned ==="),
    rootMounted: text.includes("Mounted root (ext2 filesystem)"),
    shell: text.includes("hush - the humble shell"),
    bigallocAllOk,
    bigallocLines,
    maxAllocMb,
    memprobeOk: text.includes("via malloc OK"),
    blinkmmapOk: text.includes("mmap OK"),
    x86helloOk: text.includes("HELLO x86-64 from blink!"),
    x86dynOk: text.includes("dynamic x86-64 ELF via ld-musl"),
    machineError: window.__error,
  };
  // Overall pass: the brk fix is proven if bigalloc allocated > 47MB with all-OK.
  result.pass = result.booted && result.rootMounted && result.shell &&
    result.bigallocAllOk && result.maxAllocMb >= 200 &&
    result.memprobeOk && result.blinkmmapOk &&
    result.x86helloOk && result.x86dynOk;

  window.__result = result;
  window.__done = true;
  log("\n=== AUTOTEST_COMPLETE " + JSON.stringify(result) + " ===\n");
}

main().catch((e) => {
  window.__error = String(e?.stack ?? e);
  window.__result = { pass: false, error: window.__error };
  window.__done = true;
  log("\n[FATAL] " + window.__error + "\n");
});
</script>
</body>
</html>
